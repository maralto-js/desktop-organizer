[project]
name = "desktop-organizer"
version = "1.0.0"
description = "Organizador de Desktop com IA (Ollama): seguro, reversível e auditável"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]

[project.scripts]
desktop-organizer = "desktop_organizer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["desktop_organizer", "desktop_organizer.gui"]
